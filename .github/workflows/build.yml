name: Build VYBE APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'VYBE_Android_Project.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: unzip -q VYBE_Android_Project.zip -d buildsrc

      - name: Build debug APK
        run: gradle -p buildsrc assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vybe-debug-apk
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
